<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bbdee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101d22",
                        "emerald-green": "#4CAF50",
                        "charcoal-surface": "#1c2427",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            user-select: none;
        }
        .keypad-button:active {
            transform: scale(0.95);
            background-color: #2bbdee;
            color: #101d22;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-white min-h-screen overflow-hidden">
<!-- Top Nav / System Bar -->
<header class="flex items-center justify-between px-8 py-6 border-b border-white/5">
<div class="flex items-center gap-3">
<div class="size-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-xl font-bold tracking-tight uppercase">Billiard <span class="text-primary">POS</span></h2>
</div>
<div class="flex items-center gap-8">
<div class="text-right">
<div class="text-3xl font-light tracking-widest text-white/90">21:42</div>
<div class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Terminal ID: T-08 (Lounge)</div>
</div>
<div class="flex gap-2">
<button class="size-12 rounded-lg bg-charcoal-surface flex items-center justify-center text-white/60 hover:text-white border border-white/10">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="size-12 rounded-lg bg-charcoal-surface flex items-center justify-center text-white/60 hover:text-white border border-white/10">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</div>
</header>
<main class="flex flex-col items-center justify-center pt-12 pb-20">
<!-- Headline Section -->
<div class="text-center mb-10">
<h1 class="text-white tracking-[0.2em] text-4xl font-bold leading-tight uppercase mb-2">Staff Access</h1>
<p class="text-white/50 text-sm font-normal uppercase tracking-widest">Enter authentication code to unlock terminal</p>
</div>
<!-- PIN Display Section -->
<div class="flex justify-center gap-4 mb-12">
<!-- Representing a 6-digit masked PIN -->
<div class="w-16 h-20 rounded-xl bg-charcoal-surface border-2 border-primary/40 flex items-center justify-center text-3xl font-bold text-primary shadow-[0_0_20px_rgba(43,189,238,0.2)]">8</div>
<div class="w-16 h-20 rounded-xl bg-charcoal-surface border-2 border-primary/40 flex items-center justify-center text-3xl font-bold text-primary shadow-[0_0_20px_rgba(43,189,238,0.2)]">2</div>
<div class="w-16 h-20 rounded-xl bg-charcoal-surface border-2 border-white/10 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-white/10"></div>
</div>
<div class="w-16 h-20 rounded-xl bg-charcoal-surface border-2 border-white/10 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-white/10"></div>
</div>
<div class="w-16 h-20 rounded-xl bg-charcoal-surface border-2 border-white/10 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-white/10"></div>
</div>
<div class="w-16 h-20 rounded-xl bg-charcoal-surface border-2 border-white/10 flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-white/10"></div>
</div>
</div>
<!-- Numeric Keypad Container -->
<div class="w-full max-w-md bg-charcoal-surface p-8 rounded-2xl border border-white/5 shadow-2xl">
<div class="grid grid-cols-3 gap-4 mb-6">
<!-- Row 1 -->
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">1</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">2</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">3</button>
<!-- Row 2 -->
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">4</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">5</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">6</button>
<!-- Row 3 -->
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">7</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">8</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">9</button>
<!-- Row 4 -->
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-white/40 transition-all hover:bg-white/5">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-2xl font-bold transition-all hover:bg-white/5">0</button>
<button class="keypad-button h-20 rounded-xl bg-background-dark border border-white/5 flex items-center justify-center text-white/40 transition-all hover:bg-white/5 uppercase text-xs font-bold tracking-widest">
                    Clear
                </button>
</div>
<!-- Start Shift Action -->
<button class="w-full h-20 bg-emerald-green hover:bg-emerald-green/90 text-background-dark rounded-xl flex items-center justify-center gap-3 transition-colors group">
<span class="text-xl font-extrabold uppercase tracking-[0.2em]">Start Shift</span>
<span class="material-symbols-outlined text-3xl transition-transform group-hover:translate-x-1">play_arrow</span>
</button>
</div>
<!-- Footer / Context -->
<div class="mt-12 flex items-center gap-6 text-white/30 text-[10px] uppercase tracking-[0.3em] font-medium">
<div class="flex items-center gap-2">
<div class="size-1.5 rounded-full bg-emerald-green animate-pulse"></div>
                Server Online
            </div>
<div class="w-px h-3 bg-white/10"></div>
<div>Build 4.2.0-stable</div>
<div class="w-px h-3 bg-white/10"></div>
<div>v01.2024</div>
</div>
</main>
<!-- Background Decorative Elements -->
<div class="fixed top-0 right-0 p-12 opacity-5 pointer-events-none">
<span class="material-symbols-outlined text-[240px] rotate-12">sports_handball</span>
</div>
<div class="fixed bottom-[-100px] left-[-100px] size-[400px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="fixed top-[20%] right-[-50px] size-[300px] bg-emerald-green/5 rounded-full blur-[100px] pointer-events-none"></div>
</body></html>
